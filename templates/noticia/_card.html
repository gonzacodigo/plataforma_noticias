<article class="news-card"><a class="card-image" href="{{ noticia.get_absolute_url }}" tabindex="-1" aria-hidden="true">{% if noticia.portada %}<img src="{{ noticia.portada }}" alt="" width="640" height="400" loading="lazy" decoding="async" referrerpolicy="no-referrer">{% else %}<span class="image-placeholder">desenchufadas<span>✳</span></span>{% endif %}<span class="category-badge">{{ noticia.categoria }}</span></a><div class="card-body"><div class="card-meta"><span>{{ noticia.medio }}</span><time datetime="{{ noticia.fecha|date:'c' }}">{{ noticia.fecha|date:'d M · H:i' }}</time></div><h3><a href="{{ noticia.get_absolute_url }}">{{ noticia.titulo }}</a></h3><p>{{ noticia.descripcion|truncatechars:160 }}</p><a class="read-link" href="{{ noticia.get_absolute_url }}">Leer noticia <span>↗</span></a></div></article>
